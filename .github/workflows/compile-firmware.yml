name: Compile Arduino UNO firmware

on:
  push:
    paths:
      - "firmware/SimulinkController/**"
      - ".github/workflows/compile-firmware.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile for Arduino UNO
        run: |
          arduino-cli compile --fqbn arduino:avr:uno firmware/SimulinkController
